name: Update players
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build players.json from Sleeper
        run: |
          curl -sf https://api.sleeper.app/v1/players/nfl -o raw.json
          node <<'EOF'
          const d = require('./raw.json'), POS = ['QB','RB','WR','TE','K','DEF'], out = [];
          for (const p of Object.values(d)) {
            if (!POS.includes(p.position) || !p.team || (p.position !== 'DEF' && !p.active)) continue;
            const n = p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim();
            if (n) out.push({ n, pos: p.position, tm: p.team });
          }
          out.sort((a, b) => a.n.localeCompare(b.n));
          require('fs').writeFileSync('players.json', JSON.stringify(out));
          EOF
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add players.json
          git diff --cached --quiet || (git commit -m "Update players" && git push)
