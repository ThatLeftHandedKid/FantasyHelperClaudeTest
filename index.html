<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef0ea;--ink:#1b2420;--turf:#2f6b3a;--flag:#e8b923;--red:#c8412d;--line:#c9cfc3;--card:#fafbf7}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
header{background:var(--turf);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
h1{font:700 28px/1 "Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.5px}
h2{font:600 22px "Barlow Condensed",Impact,sans-serif;margin:0 0 10px}
select,input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
nav{display:flex;gap:4px;padding:10px 20px 0;border-bottom:2px solid var(--ink);flex-wrap:wrap}
nav button{background:transparent;color:var(--ink);border:0;border-radius:4px 4px 0 0;font:600 18px "Barlow Condensed",sans-serif}
nav button[aria-selected=true]{background:var(--ink);color:#fff}
main{max-width:920px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.row{display:grid;grid-template-columns:60px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border:0}
.pos{font:700 18px "Barlow Condensed",sans-serif;color:var(--turf)}
.muted{color:#5d675f;font-size:14px}
.risk{color:var(--red);font-weight:500}
.form{display:flex;flex-wrap:wrap;gap:8px}
.form input[name=proj]{flex:1 1 260px}
.verdict{font:700 26px "Barlow Condensed",sans-serif}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Fantasy Hub</h1>
  <label>League <select id="lg"></select></label>
  <button class="ghost" style="color:#fff;border-color:#fff" id="newlg">New league</button>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="view"></main>
<script>
const KEY='fantasyhub.v1', $=s=>document.querySelector(s);
const mk=name=>({name,ppr:1,slots:{QB:1,RB:2,WR:2,TE:1,FLEX:1},players:[]});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch{}
S=S||{active:0,tab:'Lineup',weights:{ESPN:1,Sleeper:1,Custom:1},leagues:[mk('My league')]};
const L=()=>S.leagues[S.active];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const POS=['QB','RB','WR','TE','K','DEF'], TABS=['Lineup','Players','Trade','Settings'];

// Consensus engine: weighted mean of sources, dropping any that stray >35% from the median (needs 3+ sources)
function blend(p){
  const e=Object.entries(p.proj||{}).filter(([,v])=>isFinite(v));
  if(!e.length)return null;
  const vals=e.map(x=>x[1]).sort((a,b)=>a-b), med=vals[vals.length>>1];
  let keep=e.length>=3?e.filter(([,v])=>Math.abs(v-med)<=.35*med):e;
  if(!keep.length)keep=e;
  let w=0,t=0;
  keep.forEach(([k,v])=>{const x=S.weights[k]??1;w+=x;t+=x*v});
  return{m:t/w,lo:vals[0],hi:vals[vals.length-1],n:e.length};
}
const risky=b=>b.n>1&&(b.hi-b.lo)/b.m>.3;
const val=p=>isFinite(p.val)&&p.val!==''&&p.val!==null?+p.val:(blend(p)?blend(p).m*10:0);

function lineup(){
  const mine=L().players.filter(p=>p.mine&&blend(p)).sort((a,b)=>blend(b).m-blend(a).m);
  const used=new Set(), out=[];
  for(const [pos,n] of Object.entries(L().slots)){
    for(let i=0;i<n;i++){
      const p=mine.find(p=>!used.has(p)&&(pos==='FLEX'?['RB','WR','TE'].includes(p.pos):p.pos===pos));
      out.push([pos,p]); if(p)used.add(p);
    }
  }
  return{out,bench:mine.filter(p=>!used.has(p))};
}
const line=(pos,p)=>{
  const b=p&&blend(p);
  return `<div class="row"><span class="pos">${pos}</span><span>${p?esc(p.name)+' <span class="muted">'+p.pos+'</span>':'<span class="muted">Empty slot: add a player on the Players tab</span>'}</span><span>${b?b.m.toFixed(1)+(risky(b)?' <span class="risk">sources disagree ('+b.lo+'–'+b.hi+')</span>':''):''}</span></div>`;
};

const views={
  Lineup(){
    const {out,bench}=lineup(), tot=out.reduce((s,[,p])=>s+(p?blend(p).m:0),0);
    return `<div class="card"><h2>Start these players</h2>${out.map(([a,p])=>line(a,p)).join('')}<p><b>Projected total: ${tot.toFixed(1)}</b></p></div>
    <div class="card"><h2>Bench</h2>${bench.map(p=>line(p.pos,p)).join('')||'<p class="muted">No bench players yet.</p>'}</div>`;
  },
  Players(){
    return `<div class="card"><h2>Add a player</h2><form class="form" id="add">
      <input name="name" placeholder="Player name" required>
      <select name="pos">${POS.map(x=>`<option>${x}</option>`).join('')}</select>
      <input name="proj" placeholder="Projections, e.g. ESPN:14.2, Sleeper:12.8">
      <input name="val" type="number" step="any" placeholder="Trade value (optional)" style="width:190px">
      <label><input type="checkbox" name="mine" checked> On my team</label>
      <button>Add player</button></form>
      <p class="muted">Projections are points in this league's scoring. Source names with a weight in Settings are blended; any other name counts as weight 1.</p></div>
    <div class="card"><h2>Players (${L().players.length})</h2>${L().players.map((p,i)=>{const b=blend(p);
      return `<div class="row"><span class="pos">${p.pos}</span><span>${esc(p.name)} <span class="muted">${p.mine?'my team':'other / free agent'}${b?' · blended '+b.m.toFixed(1)+' from '+b.n+' source'+(b.n>1?'s':''):''}</span></span><button class="ghost" data-del="${i}">Remove</button></div>`}).join('')||'<p class="muted">Nothing here yet.</p>'}</div>`;
  },
  Trade(){
    return `<div class="card"><h2>Trade calculator</h2><div class="cols">
      <label>You give<input id="give" list="names" style="width:100%" placeholder="Names, separated by commas"></label>
      <label>You get<input id="get" list="names" style="width:100%" placeholder="Names, separated by commas"></label></div>
      <datalist id="names">${L().players.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
      <p id="tres" class="muted">Enter players on both sides.</p></div>`;
  },
  Settings(){
    const s=L().slots;
    return `<div class="card"><h2>League settings</h2><form class="form" id="set">
      <label>Name <input name="name" value="${esc(L().name)}"></label>
      <label>Scoring <select name="ppr">${[[0,'Standard'],[.5,'Half PPR'],[1,'Full PPR']].map(([v,t])=>`<option value="${v}" ${L().ppr==v?'selected':''}>${t}</option>`).join('')}</select></label>
      ${Object.keys(s).map(k=>`<label>${k} <input name="s_${k}" type="number" min="0" max="6" value="${s[k]}" style="width:64px"></label>`).join('')}
      <button>Save settings</button></form></div>
    <div class="card"><h2>Source weights</h2><form class="form" id="wt">
      ${Object.keys(S.weights).map(k=>`<label>${k} <input name="${k}" type="number" step=".1" min="0" value="${S.weights[k]}" style="width:72px"></label>`).join('')}
      <button>Save weights</button></form>
      <p class="muted">A higher weight pulls the blended number toward that source.</p></div>
    <div class="card"><h2>ESPN sync</h2><div class="form">
      <input data-k="worker" placeholder="Worker URL" value="${esc(S.worker||'')}" style="flex:1 1 260px">
      <input data-k="id" placeholder="ESPN league ID" value="${esc(E().id)}" style="width:150px">
      <input data-k="year" type="number" value="${esc(E().year)}" style="width:90px">
      <button id="sync">Sync from ESPN</button>
      <button class="ghost" id="vals">Update trade values</button></div>
      <div id="sres" class="muted" style="margin-top:8px"></div></div>
    ${S.leagues.length>1?'<button class="ghost" id="dellg">Delete this league</button>':''}`;
  }
};

function render(){
  $('#lg').innerHTML=S.leagues.map((l,i)=>`<option value="${i}" ${i==S.active?'selected':''}>${esc(l.name)}</option>`).join('');
  $('#tabs').innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t==S.tab}" data-tab="${t}">${t}</button>`).join('');
  $('#view').innerHTML=views[S.tab]();
  save();
}
function calcTrade(){
  const find=s=>s.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).map(n=>L().players.find(p=>p.name.toLowerCase()===n));
  const g=find($('#give').value), r=find($('#get').value), miss=[...g,...r].some(x=>!x);
  const sum=a=>a.reduce((t,p)=>t+(p?val(p):0),0), a=sum(g), b=sum(r), d=b-a, pct=a+b?Math.abs(d)/((a+b)/2)*100:0;
  $('#tres').innerHTML=!g.length||!r.length?'Enter players on both sides.':
    `<span class="verdict">${pct<10?'Fair trade':d>0?'You win this trade':'You lose this trade'}</span><br>You give ${a.toFixed(0)} · You get ${b.toFixed(0)} · Difference ${d>0?'+':''}${d.toFixed(0)}${miss?'<br><span class="risk">Some names did not match a player on the Players tab.</span>':''}`;
}

// ESPN sync (talks to the Cloudflare Worker in /worker)
const E=()=>(L().espn=L().espn||{id:'',year:new Date().getFullYear(),teamId:''});
const sres=h=>{const n=$('#sres');if(n)n.innerHTML=h};
const key=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
let pend=null;
async function api(path){
  if(!S.worker)throw new Error('Paste your Worker URL first.');
  const r=await fetch(S.worker.replace(/\/$/,'')+path);
  if(!r.ok)throw new Error(await r.text()||('Request failed ('+r.status+')'));
  return r.json();
}
function applyTeam(tid){
  const old=Object.fromEntries(L().players.map(p=>[key(p.name),p]));
  L().players=pend.teams.flatMap(t=>t.players.map(x=>{
    const o=old[key(x.name)]||{};
    return{name:x.name,pos:x.pos,mine:t.id==tid,proj:{...(o.proj||{}),...(x.pts!=null?{ESPN:x.pts}:{})},val:o.val??null};
  }));
  L().ppr=pend.ppr; L().teams=pend.teams.length;
  for(const k in L().slots)L().slots[k]=pend.slots[k]??0;
  E().teamId=tid; render();
  const none=!L().players.some(p=>p.proj.ESPN!=null);
  sres('Synced '+L().players.length+' players.'+(none?' ESPN returned no projections, so enter them by hand for now.':''));
}
document.addEventListener('change',e=>{
  const k=e.target.dataset.k; if(!k)return;
  if(k==='worker')S.worker=e.target.value.trim(); else E()[k]=e.target.value.trim();
  save();
});
document.addEventListener('click',async e=>{
  const id=e.target.id;
  try{
    if(id==='sync'){
      sres('Syncing…'); pend=await api(`/league?id=${encodeURIComponent(E().id)}&year=${encodeURIComponent(E().year)}`);
      if(pend.teams.some(t=>t.id==E().teamId))return applyTeam(E().teamId);
      sres(`Which team is yours? <select id="tm">${pend.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select> <button id="usetm">Use this team</button>`);
    }
    if(id==='usetm')applyTeam($('#tm').value);
    if(id==='vals'){
      sres('Fetching trade values…');
      const v=await api(`/values?ppr=${L().ppr}&teams=${L().teams||12}&qbs=${L().slots.QB>1?2:1}`);
      let n=0; L().players.forEach(p=>{const x=v[key(p.name)];if(x!=null){p.val=x;n++}});
      render(); sres('Updated trade values for '+n+' of '+L().players.length+' players.');
    }
  }catch(err){sres('<span class="risk">'+esc(err.message)+'</span>')}
});
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.tab){S.tab=t.dataset.tab;render()}
  if(t.dataset.del){L().players.splice(+t.dataset.del,1);render()}
  if(t.id==='newlg'){const n=prompt('League name?');if(n){S.leagues.push(mk(n));S.active=S.leagues.length-1;render()}}
  if(t.id==='dellg'&&confirm('Delete '+L().name+'?')){S.leagues.splice(S.active,1);S.active=0;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='give'||e.target.id==='get')calcTrade()});
$('#lg').addEventListener('change',e=>{S.active=+e.target.value;render()});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=new FormData(e.target), id=e.target.id;
  if(id==='add'){
    const proj={};
    (f.get('proj')||'').split(',').forEach(s=>{const [k,v]=s.split(':');if(k&&isFinite(parseFloat(v)))proj[k.trim()]=parseFloat(v)});
    L().players.push({name:f.get('name').trim(),pos:f.get('pos'),mine:f.has('mine'),proj,val:f.get('val')===''?null:+f.get('val')});
  }
  if(id==='set'){L().name=f.get('name');L().ppr=+f.get('ppr');for(const k in L().slots)L().slots[k]=+f.get('s_'+k)}
  if(id==='wt'){for(const k in S.weights)S.weights[k]=+f.get(k)}
  render();
});
render();
</script>
</body>
</html>
